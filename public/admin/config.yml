backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)
media_folder: "public/img"
public_folder: "/img"
local_backend: true
# site_url: http://localhost:3000
# display_url: https://gff.f

collections:
  - label: Pages
    name: pages
    create: false
    files:
      - label: "Music Video Workshop"
        name: "photo"
        file: "/content/pages/photo.md"
        fields:
          - {label: Heading, name: heading, widget: string}
          - {label: Body, name: body, widget: markdown}
          - label: Photos
            name: photos
            widget: list
            create: true
            fields:
              - {label: Photo, name: photo, widget: image, media_folder: "/public/img/photo-exhibit" }

      - label: "Discussions Page"
        name: "discussions"
        file: "/content/pages/discussions.md"
        fields:
          - {label: Heading, name: heading, widget: string}
          - {label: Body, name: body, widget: markdown}
          - {label: Announced, name: isAnnounced, widget: boolean }
      - label: "Tickets"
        name: "tickets"
        file: "/content/pages/tickets.md"
        fields:
          - {label: Heading, name: heading, widget: string}
          - {label: Body, name: body, widget: markdown}
          - {label: Tickets Link, name: link, widget: string, hint: Must be the full URL to the site ("http://mysite.com"), pattern: ['https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&//=]*)', 'Must be a full URL']}
      - label: "Hel's Kitchen"
        name: "helskitchen"
        file: "/content/pages/helskitchen.md"
        fields:
          - {label: Heading, name: heading, widget: string}
          - {label: Body, name: body, widget: markdown}
          - {label: Announced, name: isAnnounced, widget: boolean }
      - label: "Sponsors"
        name: "sponsors"
        file: "/content/pages/sponsors.md"
        fields:
          - {label: Heading, name: heading, widget: string}
          - {label: Body, name: body, widget: markdown}
          - label: Sponsors
            label_singular: Sponsor
            name: logos
            widget: list
            fields:
              - { label: Name, name: name, widget: string}
              - label: Logo
                name: logo
                widget: "image"
                media_folder: /public/img/sponsor-logos
      - label: "About"
        name: "about"
        file: "/content/pages/about.md"
        fields:
          - {label: Heading, name: heading, widget: string}
          - {label: About, name: body, widget: markdown}
          - label: Staff
            name: staff
            label_singular: Person
            create: true
            widget: list
            fields:
              - { label: Name, name: name, widget: string}
              - { label: Role, name: role, widget: string}
              - { label: 'Email', name: 'email', widget: 'string', hint: Must be in valid email address format, pattern: ['\b[\w\.-]+@[\w\.-]+\.\w{2,8}\b', 'Full email address format']}
              - label: "Featured Image"
                name: "thumbnail"
                widget: "image"
                media_folder: /public/img/staff-portraits
      - label: "Where"
        name: "where"
        file: "/content/pages/where.md"
        fields:
          - {label: Heading, name: heading, widget: string}
          - {label: Body, name: body, widget: markdown}
      - label: "When"
        name: "when"
        file: "/content/pages/when.md"
        fields:
          - {label: Heading, name: heading, widget: string}
          - {label: Announced, name: isAnnounced, widget: boolean }
          - {label: Body, name: body, widget: markdown}
  - name: editions
    label: Editions
    label_singular: Edition
    folder: 'content/editions'
    format: 'frontmatter'
    create: true
    slug: '{{year}}'
    identifier_field: year
    summary: '{{year}} — {{dates}}'
    sortable_fields: ['year']
    editor:
      preview: false
    fields:
      - { label: 'Year', name: 'year', widget: 'number', value_type: 'int', min: 2023, max: 2100 }
      - { label: 'Heading', name: 'heading', widget: 'string', default: 'The Movies' }
      - { label: 'Run Dates', name: 'dates', widget: 'string', hint: 'Shown on the archive index, e.g. "28–31 August 2025"' }
      - { label: 'Announced', name: 'isAnnounced', widget: 'boolean', default: false }
      - { label: 'Announcement', name: 'announcement', widget: 'string', required: false, hint: 'Shown on the Movies page only, never in the archive. Use for "next year revealed soon" notes.' }
      - label: "Archive Image"
        name: "featuredImage"
        widget: "image"
        required: false
        media_folder: /public/img/film-stills
        hint: 'Thumbnail for this year on the archive index. Falls back to the first film still.'
      - { label: 'Intro', name: 'body', widget: 'markdown' }
      - label: 'Program Sections'
        name: 'sections'
        label_singular: Section
        widget: 'list'
        required: false
        allow_add: true
        summary: '{{fields.title}}'
        hint: 'Order here is the order on the page. A section with no films is hidden. A film whose Program does not match any section here will still appear on the page, ungrouped, at the end.'
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Program', name: 'program', widget: 'select', options: ['features', 'helsingborg', 'music', 'shorts1', 'shorts2'] }
          - { label: 'Description', name: 'description', widget: 'text', required: false }
  # Annual rollover procedure — when a new festival year's program goes live, do ALL of
  # the following. Missing any of the first three means new films the editor creates in
  # the CMS silently get the outgoing year, and they will not show up on /movies.
  #   1. Create the new edition: add content/editions/<year>.md (year, heading, dates,
  #      isAnnounced, sections, body).
  #   2. Below, in this `films` collection, update the `filter: { field: year, value: 2025 }`
  #      line to the new year, so the CMS Films list shows the new year's films by default.
  #   3. Below, in this `films` collection's `fields` list, update the Year field's
  #      `default: 2025` (in the line starting `{ label: 'Year', name: 'year', ... }`) to
  #      the new year, so new films are pre-filled with the correct year.
  #   4. In the `films_archive` collection further down, update the `view_filters` entry's
  #      `pattern: 2025` to the new year, so its "Current program only" filter stays correct.
  #   5. Update `content/settings.yml`'s `currentEdition` to the new year — this is what
  #      actually moves the previous year's program into the archive and switches /movies
  #      to the new one. (Editable from Site Settings > Current Edition in the CMS.)
  - name: films
    label: Films
    label_singular: Film
    folder: 'content/films'
    format: 'frontmatter'
    create: true
    slug: '{{slug}}'
    filter: { field: year, value: 2025 }
    sortable_fields: ['title', 'year']
    editor:
      preview: false
    fields: &film_fields
      - { label: 'Year', name: 'year', widget: 'number', value_type: 'int', default: 2025, min: 2023, max: 2100, hint: 'Which festival edition this film belongs to.' }
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Type', name: 'type', widget: 'select', options: ['Documentary', 'Fiction'] }
      - { label: 'Program', name: 'program', widget: select, options: ['features', 'helsingborg', 'music', 'shorts1', 'shorts2'] }
      - { label: 'Duration in Minutes', name: 'durationInMinutes', widget: 'string' }
      - label: "Featured Image"
        name: "thumbnail"
        widget: "image"
        media_folder: /public/img/film-stills
      - label: 'Additional Still'
        name: 'stills'
        widget: 'list'
        allow_add: true
        label_singular: Additional Still
        summary: '{{fields.still}}'
        fields:
          - {label: Still, name: still, widget: image, media_folder: "/public/img/film-stills" }
      - { label: 'Synopsis', name: 'body', widget: 'markdown' }
      - { label: 'Country', name: 'country', widget: 'string' }
      - { label: 'Language', name: 'language', widget: 'string' }
      - { label: 'Director', name: 'director', widget: 'string' }
      # - { label: 'Producer', name: 'producer', widget: 'string' }
      - label: 'Producers'
        name: 'producers'
        widget: 'list'
        allow_add: true
        label_singular: Producer
        summary: '{{fields.producer}}'
        fields:
          - {label: Producer, name: producer, widget: string }
      - label: 'Executive Producers'
        name: 'execProducers'
        widget: 'list'
        allow_add: true
        label_singular: Executive Producer
        summary: '{{fields.execProducer}}'
        fields:
          - {label: Executive Producer, name: execProducer, widget: string }
      - label: 'Cast'
        name: 'cast'
        widget: 'list'
        allow_add: true
        label_singular: Cast Member
        summary: '{{fields.actor}}'
        fields:
          - {label: Actor, name: actor, widget: string }
      - { label: 'Music', name: 'music', widget: 'string' }
      - { label: 'Cinematography', name: 'cinematography', widget: 'string' }
      - { label: 'Editor', name: 'editor', widget: 'string' }
      - { label: 'Contact', name: 'contact', widget: 'string', hint: Must be in valid email address format, pattern: ['\b[\w\.-]+@[\w\.-]+\.\w{2,8}\b', 'Full email address format']}
      - { label: 'Film Website', name: 'filmWebsite', widget: 'string', hint: Must be the full URL to the site ("http://mysite.com"), pattern: ['https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&//=]*)', 'Must be a full URL'] }
      - { label: 'Film Trailer', name: 'filmTrailer', widget: 'string', hint: Must be the full URL to the site ("http://youtu.be/12345"), pattern: ['https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&//=]*)', 'Must be a full URL'] }
      - label: Screenings
        name: screenings
        label_singular: screening
        allow_add: true
        widget: list
        summary: "{{dateTime | date('dddd, MMMM DD HH:mm')}}"
        fields:
          - {label: Date/Time, name: dateTime, widget: datetime,  date_format: "dddd, MMMM DD", time_format: "HH:mm", format: "dddd, MMMM DD HH:mm"}
          - {label: Venue, name: venue, widget: select, options: ["roda-kvarn", "fryshusset", "vagnhall-16"]}
  - name: films_archive
    label: Archive
    label_singular: Archived Film
    folder: 'content/films'
    format: 'frontmatter'
    create: false
    slug: '{{slug}}'
    sortable_fields: ['year', 'title']
    summary: '{{year}} — {{title}}'
    view_groups:
      - label: Year
        field: year
    view_filters:
      - label: 'Current program only'
        field: year
        pattern: 2025
    editor:
      preview: false
    fields: *film_fields
  - name: talks
    label: Talks
    label_singular: Talk
    folder: 'content/talks'
    format: 'frontmatter'
    create: true
    slug: '{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - label: "Featured Image"
        name: "thumbnail"
        widget: "image"
        media_folder: /public/img/talk-stills
      - { label: 'Synopsis', name: 'body', widget: 'markdown' }
      # - { label: 'Location', name: 'location', widget: 'string' }
      - { label: Date/Time, name: dateTime, widget: datetime,  date_format: "dddd, MMMM DD", time_format: "HH:mm", format: "dddd, MMMM DD HH:mm"}
      - { label: Venue, name: venue, widget: select, options: ["roda-kvarn", "fryshusset", "vagnhall-16"]}
      - { label: Ticket Page, name: 'ticketsLink', widget: 'string' }
  - label: "Site Settings"
    name: "settings"
    files:
      - label: "Accepting Submissions"
        name: "submissions"
        file: "content/submissions.yml"
        fields:
          - {label: Accepting Submissions, name: acceptingSubmissions, widget: boolean}
      - label: "Current Edition"
        name: "current_edition"
        file: "content/settings.yml"
        fields:
          - { label: 'Current Edition Year', name: 'currentEdition', widget: 'number', value_type: 'int', min: 2023, max: 2100, hint: 'Which edition the Movies page shows. Change this when a new program goes live — the previous year moves into the archive automatically.' }
